matrix:
  CHANNEL:
    - stable
    - nightly
  FEATURE_FLAGS:
    - --no-default-features
    - --all-features

steps:
  test:
    image: rust
    environment:
      RUST_BACKTRACE: 1
      CARGO_TEST_COLOR: always
    commands:
      - rustup default "$CHANNEL"
      - cargo test -j4 --tests --examples $FEATURE_FLAGS
      - cargo test -j4 --doc $FEATURE_FLAGS
    when:
      event: [pull_request, push, tag]
